name: Rollback to Known Commit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'eu-west-2'

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Construct image URI
      id: image
      run: |
        IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/tif-web:${{ github.event.inputs.commit_sha }}"
        echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

    - name: Download current task definition
      run: |
        aws ecs describe-task-definition --task-definition tif-dev-eu-west-2-taskdef-web \
          --query taskDefinition > task-definition.json

    - name: Render rollback task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: web
        image: ${{ steps.image.outputs.image }}

    - name: Deploy rollback task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: tif-dev-eu-west-2-service-web
        cluster: tif-dev-eu-west-2-ecs-cluster
        wait-for-service-stability: true
